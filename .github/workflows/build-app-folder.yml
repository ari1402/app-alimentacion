name: Actualizar carpeta app/ (GitHub Pages desde la rama)

# Para GitHub Pages en modo "Deploy from a branch": compila la app y la guarda en
# app/ dentro de la rama, así https://<usuario>.github.io/<repo>/ funciona sin tocar
# Settings. (Si cambiás Pages a "GitHub Actions", publica pages.yml y esto sobra.)

on:
  push:
    branches: [main, claude/great-cerf-fisdea]
    paths-ignore: ["app/**", "404.html"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-folder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build en /app/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/app/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: Verificar que el build no tenga secretos
        run: |
          if grep -rIl -E "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}" dist; then echo "::error::El build contiene algo que parece un secreto"; exit 1; fi
      - name: Copiar a app/ y commitear si cambió
        run: |
          rm -rf app && cp -r dist app
          cp dist/index.html 404.html
          touch .nojekyll
          git add app 404.html .nojekyll
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Actualizar app compilada [skip ci]"
          git push
